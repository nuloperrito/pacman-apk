name: pacman_apk
description: A GUI package manager and package installer for Windows Subsystem for Android (WSA).
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: '>=3.12.2 <4.0.0'
  flutter: '>=3.44.4'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  fluent_ui: ^4.16.0
  shared_value: ^2.1.2
  synchronized: ^3.0.0
  provider: ^6.1.2
  system_theme: ^3.0.1
  window_manager: ^0.5.2
  smooth_scroll_multiplatform:
    git: https://github.com/alesimula/dyn_mouse_scroll.git
  flutter_acrylic: ^1.1.4
  yaml: ^3.1.2
  jovial_svg: ^1.1.29
  protobuf: ^5.1.0
  flutter_material_design_icons: ^3.1.0
  win32: ^5.5.0
  base32: ^2.1.3
  charset: ^2.0.0
  archive: ^4.0.9
  args: ^2.4.2
  xml: ^6.6.1
  crypto: ^3.0.6

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/missing_icon_background.si
    - assets/icons/missing_icon_foreground.si
    - assets/icons/missing_icon_legacy.si
    - assets/images/logo.png