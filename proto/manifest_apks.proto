syntax = "proto3";
package proto;
option optimize_for = SPEED;

message BuildApksResult {
    repeated Variant variant = 1;
    Bundletool bundletool = 2;
    repeated AssetSliceSet asset_slice_set = 3;
    string package_name = 4;
    LocalTestingInfo local_testing_info = 5;
    AssetModulesInfo asset_modules_info = 6;
    repeated DefaultTargetingValue default_targeting_value = 7;
    repeated PermanentlyFusedModule permanently_fused_modules = 8;
    DeviceGroupConfig device_group_config = 9;
}

message Variant {
    VariantTargeting targeting = 1;
    repeated ApkSet apk_set = 2;
    uint32 variant_number = 3;
    VariantProperties variant_properties = 4;
}

message Bundletool {
    string version = 2;
}

message AssetSliceSet {
    AssetModuleMetadata asset_module_metadata = 1;
    repeated ApkDescription apk_description = 2;
}

message LocalTestingInfo {
    bool enabled = 1;
    string local_testing_path = 2;
}

message AssetModulesInfo {
    repeated int64 app_version = 1;
    string asset_version_tag = 2;
}

message DefaultTargetingValue {
    int32 dimension = 1;
    string default_value = 2;
}

message PermanentlyFusedModule {
    string name = 1;
}

message DeviceGroupConfig {
    repeated DeviceGroup device_groups = 1;
}

message DeviceGroup {
    string name = 1;
    repeated DeviceSelector device_selectors = 2;
}

message DeviceSelector {
    DeviceRam device_ram = 1;
    repeated DeviceId included_device_ids = 2;
    repeated DeviceId excluded_device_ids = 3;
    repeated SystemFeature required_system_features = 4;
    repeated SystemFeature forbidden_system_features = 5;
    repeated SystemOnChip system_on_chips = 6;
}

message DeviceRam {
    int64 min_bytes = 1;
    int64 max_bytes = 2;
}

message DeviceId {
    string build_brand = 1;
    string build_device = 2;
}

message SystemFeature {
    string name = 1;
}

message SystemOnChip {
    string manufacturer = 1;
    string model = 2;
}

message VariantTargeting {
    SdkVersionTargeting sdk_version_targeting = 1;
    AbiTargeting abi_targeting = 2;
    ScreenDensityTargeting screen_density_targeting = 3;
    MultiAbiTargeting multi_abi_targeting = 4;
    TextureCompressionFormatTargeting texture_compression_format_targeting = 5;
    SdkRuntimeTargeting sdk_runtime_targeting = 6;
}

message SdkRuntimeTargeting {
    bool requires_sdk_runtime = 1;
}

message VariantProperties {
    bool uncompressed_dex = 1;
    bool uncompressed_native_libraries = 2;
    bool sparse_encoding = 3;
}

message ApkSet {
    ModuleMetadata module_metadata = 1;
    repeated ApkDescription apk_description = 2;
}

message ModuleMetadata {
    string name = 1;
    FeatureModuleType module_type = 7;
    DeliveryType delivery_type = 6;
    bool is_instant = 3;
    repeated string dependencies = 4;
    ModuleTargeting targeting = 5;
    bool on_demand_deprecated = 2 [deprecated = true];
    repeated RuntimeEnabledSdkDependency runtime_enabled_sdk_dependencies = 8;
    SdkModuleMetadata sdk_module_metadata = 9;
}

enum FeatureModuleType {
    UNKNOWN_MODULE_TYPE = 0;
    FEATURE_MODULE = 1;
    ML_MODULE = 2;
    SDK_MODULE = 3;
}

enum DeliveryType {
    UNKNOWN_DELIVERY_TYPE = 0;
    INSTALL_TIME = 1;
    ON_DEMAND = 2;
    FAST_FOLLOW = 3;
}

message ModuleTargeting {
    SdkVersionTargeting sdk_version_targeting = 1;
    repeated DeviceFeatureTargeting device_feature_targeting = 2;
    UserCountriesTargeting user_countries_targeting = 3;
    DeviceGroupModuleTargeting device_group_targeting = 5;
}

message DeviceFeature {
  string feature_name = 1;
  int32 feature_version = 2;
}

message DeviceFeatureTargeting {
    DeviceFeature required_feature = 1;
}

message UserCountriesTargeting {
    repeated string country_codes = 1;
    bool exclude = 2;
}

message DeviceGroupModuleTargeting {
    repeated string value = 1;
}

message RuntimeEnabledSdkDependency {
    string package_name = 1;
    int32 major_version = 2;
    int32 minor_version = 3;
}

message SdkModuleMetadata {
    SdkModuleVersion sdk_module_version = 1;
    string sdk_package_name = 2;
    int32 resources_package_id = 3;
}

message SdkModuleVersion {
    int32 major = 1;
    int32 minor = 2;
    int32 patch = 3;
}

message ApkDescription {
    ApkTargeting targeting = 1;
    string path = 2;
    oneof apk_metadata_oneof_value {
        SplitApkMetadata split_apk_metadata = 3;
        StandaloneApkMetadata standalone_apk_metadata = 4;
        SplitApkMetadata instant_apk_metadata = 5;
        SystemApkMetadata system_apk_metadata = 6;
        SplitApkMetadata asset_slice_metadata = 7;
        ApexApkMetadata apex_apk_metadata = 8;
        ArchivedApkMetadata archived_apk_metadata = 9;
    }
    SigningDescription signing_description = 10;
}

message ApkTargeting {
    AbiTargeting abi_targeting = 1;
    LanguageTargeting language_targeting = 3;
    ScreenDensityTargeting screen_density_targeting = 4;
    SdkVersionTargeting sdk_version_targeting = 5;
    TextureCompressionFormatTargeting texture_compression_format_targeting = 6;
    MultiAbiTargeting multi_abi_targeting = 7;
    SanitizerTargeting sanitizer_targeting = 8;
    DeviceTierTargeting device_tier_targeting = 9 [deprecated = true];
    CountrySetTargeting country_set_targeting = 10 [deprecated = true];
    DeviceGroupTargeting device_group_targeting = 11;
}

message SplitApkMetadata {
    string split_id = 1;
    bool is_master_split = 2;
}

message StandaloneApkMetadata {
    repeated string fused_module_name = 1;
    string split_id = 3;
}

message SystemApkMetadata {
    repeated string fused_module_name = 1;
}

message ApexApkMetadata {
    repeated ApexEmbeddedApkConfig apex_embedded_apk_config = 1;
}

message ApexEmbeddedApkConfig {
    string package_name = 1;
    string path = 2;
}

message ArchivedApkMetadata {}

message SigningDescription {
    bool signed_with_rotated_key = 1;
}

message AbiTargeting {
    repeated Abi value = 1;
    repeated Abi alternatives = 2;
}

message Abi {
    enum AbiAlias {
        UNSPECIFIED_CPU_ARCHITECTURE = 0;
        ARMEABI = 1;
        ARMEABI_V7A = 2;
        ARM64_V8A = 3;
        X86 = 4;
        X86_64 = 5;
        MIPS = 6;
        MIPS64 = 7;
        RISCV64 = 8;
    }
    AbiAlias alias = 1;
}

message ScreenDensityTargeting {
    repeated ScreenDensity value = 1;
    repeated ScreenDensity alternatives = 2;
}

message ScreenDensity {
    enum DensityAlias {
        DENSITY_UNSPECIFIED = 0;
        NODPI = 1;
        LDPI = 2;
        MDPI = 3;
        TVDPI = 4;
        HDPI = 5;
        XHDPI = 6;
        XXHDPI = 7;
        XXXHDPI = 8;
    }
    oneof density_oneof {
        DensityAlias density_alias = 1;
        int32 density_dpi = 2;
    }
}

message LanguageTargeting {
    repeated string value = 1;
    repeated string alternatives = 2;
}

message TextureCompressionFormatTargeting {
    repeated TextureCompressionFormat value = 1;
    repeated TextureCompressionFormat alternatives = 2;
}

message TextureCompressionFormat {
    enum TextureCompressionFormatAlias {
        UNSPECIFIED_TEXTURE_COMPRESSION_FORMAT = 0;
        ETC1_RGB8 = 1;
        PALETTED = 2;
        THREE_DC = 3;
        ATC = 4;
        LATC = 5;
        DXT1 = 6;
        S3TC = 7;
        PVRTC = 8;
        ASTC = 9;
        ETC2 = 10;
    }
    TextureCompressionFormatAlias alias = 1;
}

message MultiAbiTargeting {
    repeated MultiAbi value = 1;
    repeated MultiAbi alternatives = 2;
}

message MultiAbi {
    repeated Abi abi = 1;
}

message SdkVersionTargeting {
    repeated SdkVersion value = 1;
    repeated SdkVersion alternatives = 2;
}

message SdkVersion {
    Int32Value min = 1;
}

message DeviceTierTargeting {
    repeated Int32Value value = 3;
    repeated Int32Value alternatives = 4;
}

message CountrySetTargeting {
    repeated string value = 1;
    repeated string alternatives = 2;
}

message DeviceGroupTargeting {
    repeated string value = 1;
    repeated string alternatives = 2;
}

message SanitizerTargeting {
    repeated Sanitizer value = 1;
}

message Sanitizer {
    enum SanitizerAlias {
        NONE = 0;
        HWADDRESS = 1;
    }
    SanitizerAlias alias = 1;
}

message Int32Value {
    int32 value = 1;
}

message AssetModuleTargeting {
  UserCountriesTargeting user_countries_targeting = 1;
  DeviceGroupModuleTargeting device_group_targeting = 2;
}

message AssetModuleMetadata {
    string name = 1;
    DeliveryType delivery_type = 4;
    InstantMetadata instant_metadata = 3;
    bool on_demand_deprecated = 2 [deprecated = true];
    AssetModuleType asset_module_type = 5;
    AssetModuleTargeting targeting = 6;
}

message InstantMetadata {
    bool is_instant = 1;
    DeliveryType delivery_type = 3;
    bool on_demand_deprecated = 2 [deprecated = true];
}

enum AssetModuleType {
    UNKNOWN_ASSET_TYPE = 0;
    DEFAULT_ASSET_TYPE = 1;
    AI_PACK_TYPE = 2;
}